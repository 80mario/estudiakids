# Mantiene despierto el servidor de EstudiaKids.
# Supabase gratis pausa el proyecto tras 7 dias sin actividad real,
# asi que cada dia escribimos la hora del "latido" en la base de datos.
name: Mantener despierto Supabase
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - name: Latido en la base de datos
        run: |
          curl -fsS -X POST \
            "https://iweksgjjmrtrjslgsxbg.supabase.co/rest/v1/rpc/latido" \
            -H "apikey: sb_publishable_2LaMRzrETWeZyncrT5k5jw_bcv8zsvY" \
            -H "Content-Type: application/json" -d '{}'
          echo
      - name: Comprobar login
        run: |
          curl -fsS "https://iweksgjjmrtrjslgsxbg.supabase.co/auth/v1/health" \
            -H "apikey: sb_publishable_2LaMRzrETWeZyncrT5k5jw_bcv8zsvY"

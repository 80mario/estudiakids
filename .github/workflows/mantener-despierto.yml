    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Toque a la base de datos
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" \
            "https://iweksgjjmrtrjslgsxbg.supabase.co/rest/v1/ek_datos?select=user_id&limit=1" \
            -H "apikey: sb_publishable_2LaMRzrETWeZyncrT5k5jw_bcv8zsvY"
